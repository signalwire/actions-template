name: Package local copy
description: Copy a published package artifact to another path in the packages bucket (object paths mirror /var/www)

# The path and the Teleport-era inputs are kept so existing callers keep working; only SRC and DST are used.
inputs:
  TELEPORT_VERSION:
    required: false
    description: Unused
  JOIN_METHOD:
    required: false
    description: Unused
  K8S_CLUSTER_NAME:
    required: false
    description: Unused
  SRC:
    required: true
    description: 'Source path under /var/www/'
  DST:
    required: true
    description: 'Destination path under /var/www/'
  TELEPORT_APP:
    required: false
    description: Unused

runs:
  using: "composite"
  steps:
    - name: Map SRC and DST to bucket paths
      id: gcs_paths
      if: ${{ inputs.SRC != inputs.DST }}
      shell: bash
      env:
        SRC: ${{ inputs.SRC }}
        DST: ${{ inputs.DST }}
      run: |
        for p in "${SRC}" "${DST}"; do
          if [[ "${p}" != /var/www/* ]]; then
            echo "::error::SRC and DST must start with /var/www/ (got '${p}')"
            exit 1
          fi
        done
        echo "src=${SRC#/var/www/}" >> "${GITHUB_OUTPUT}"
        echo "dst=${DST#/var/www/}" >> "${GITHUB_OUTPUT}"

    # By full reference: callers sparse-checkout only this action.
    - name: Copy SRC to DST in GCS
      if: ${{ inputs.SRC != inputs.DST }}
      uses: signalwire/actions-template/.github/actions/rclone-s3-sync@main
      with:
        SRC: ${{ steps.gcs_paths.outputs.src }}
        DST: ${{ steps.gcs_paths.outputs.dst }}
        SYNC_TYPE: remote-to-remote
        OPERATION: copyto
        S3_PROVIDER: gcs
        S3_BUCKET: gcs-prod-us-central1-ci-packages-1
        GCS_WORKLOAD_IDENTITY_PROVIDER: projects/560294807735/locations/global/workloadIdentityPools/github/providers/infrastructure-lives
