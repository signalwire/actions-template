name: Build and Distribute (via Docker)

on:
  workflow_call:
    inputs:
      REF:
        required: false
        description: The branch, tag or SHA to checkout
        type: string
      ENVIRONMENT:
        required: false
        type: string
        description: Environment where the variables and secrets are scoped to
      RUNNER:
        required: false
        default: ubuntu-latest
        description: A GitHub runner type
        type: string
      REPO_DOMAIN:
        required: false
        description: Domain name of repository
        type: string
      PLATFORM:
        required: true
        description: Default Linux Arch (amd64/arm32v7/...)
        type: string
      DOCKERFILE:
        required: true
        description: Path to Dockerfile
        type: string
      MAINTAINER:
        required: true
        description: Package maintainer
        type: string
      ARTIFACTS_PATTERN:
        required: false
        default: '.*\.(deb|rpm)$'
        description: Regexp that matches artifacts
        type: string
      TARGET_ARTIFACT_NAME:
        required: true
        description: Artifact name
        type: string
      UPLOAD_BUILD_ARTIFACTS:
        required: false
        type: boolean
        default: true
        description: Enable upload build artifacts related steps
      UPLOAD_WITH_TELEPORT:
        required: false
        type: boolean
        default: true
        description: Upload build artifacts to the remote host via Teleport (needs UPLOAD_BUILD_ARTIFACTS)
      UPLOAD_WITH_GCS:
        required: false
        type: boolean
        default: true
        description: Upload build artifacts to the GCS packages bucket (needs UPLOAD_BUILD_ARTIFACTS)
      DOCKER_REGISTRY:
        required: false
        type: string
        default: ""
        description: Docker registry to log in to (e.g. <name>.azurecr.io), empty means Docker Hub
      LOG_RETENTION_DAYS:
        required: false
        type: number
        default: 7
        description: Number of days to keep build log artifacts
      META_FILE_PATH_PREFIX:
        required: true
        type: string
        description: A prefix to append to meta file (also target folder where the files should be sent on remote)
      META_REPO:
        required: false
        type: string
        default: ""
        description: DEPRECATED - Target meta repo to sync metadata changes
      META_REPO_BRANCH:
        required: false
        type: string
        default: ""
        description: DEPRECATED - Target meta repo branch name
      META_REPO_DEFAULT_BRANCH:
        required: false
        type: string
        default: "main"
        description: DEPRECATED - Target meta repo default branch name
      CODE_WORKING_DIRECTORY:
        required: false
        type: string
        default: "code"
        description: Working directory to place code into
      ARTIFACTS_DIR:
        required: false
        type: string
        default: "build"
        description: Directory to place produced artifacts into (will be inside CODE_WORKING_DIRECTORY)
      GCS_BUCKET:
        required: false
        type: string
        default: "gcs-prod-us-central1-ci-packages-1"
        description: GCS bucket to upload artifacts into
      GCS_DST_STRIP_REGEX:
        required: false
        type: string
        default: "^/var/www/"
        description: Regex removed from META_FILE_PATH_PREFIX to form the GCS object path

    secrets:
      HOSTNAME:
        required: true
      PROXY_URL:
        required: true
      TELEPORT_TOKEN:
        required: true
      USERNAME:
        required: true
      REPO_USERNAME:
        required: false
      REPO_PASSWORD:
        required: false
      DEPLOYMENT_TOKEN:
        required: false
      DOCKER_REGISTRY_USERNAME:
        required: false
      DOCKER_REGISTRY_PASSWORD:
        required: false
      # GH_BOT_DEPLOY_TOKEN is DEPRECATED
      GH_BOT_DEPLOY_TOKEN:
        required: false

env:
  # Workload Identity provider used to authenticate to GCS
  GCS_WORKLOAD_IDENTITY_PROVIDER: projects/560294807735/locations/global/workloadIdentityPools/github/providers/infrastructure-lives

jobs:
  build-and-distribute:
    runs-on: ${{ inputs.RUNNER }}
    permissions:
      contents: read
      id-token: write
    environment: ${{ inputs.ENVIRONMENT }}
    steps:
      - name: Checkout code
        if: ${{ inputs.REF == '' }}
        uses: actions/checkout@v6
        with:
          fetch-depth: 0
          path: ${{ inputs.CODE_WORKING_DIRECTORY }}

      - name: Checkout code by REF
        if: ${{ inputs.REF != '' }}
        uses: actions/checkout@v6
        with:
          ref: ${{ inputs.REF }}
          fetch-depth: 0
          path: ${{ inputs.CODE_WORKING_DIRECTORY }}

      - name: Checkout reusable actions
        uses: actions/checkout@v6
        with:
          repository: signalwire/actions-template
          ref: main
          fetch-depth: 1
          persist-credentials: false
          path: actions
          sparse-checkout: |
            .github/actions/teleport/action.yml
            .github/actions/rclone-s3-sync/action.yml
            .github/actions/docker-build-artifacts/action.yml
          sparse-checkout-cone-mode: false

      - name: Check Docker registry credentials
        id: docker_registry
        shell: bash
        env:
          DOCKER_REGISTRY_PASSWORD: ${{ secrets.DOCKER_REGISTRY_PASSWORD }}
        run: |
          if [[ -n "${DOCKER_REGISTRY_PASSWORD}" ]]; then
            echo "enabled=true" >> "${GITHUB_OUTPUT}"
          fi

      - name: Login to Docker registry
        if: ${{ steps.docker_registry.outputs.enabled == 'true' }}
        uses: docker/login-action@v4
        with:
          registry: ${{ inputs.DOCKER_REGISTRY }}
          username: ${{ secrets.DOCKER_REGISTRY_USERNAME }}
          password: ${{ secrets.DOCKER_REGISTRY_PASSWORD }}

      - name: Build artifacts via Docker
        uses: ./actions/.github/actions/docker-build-artifacts
        with:
          REPO_DOMAIN: ${{ inputs.REPO_DOMAIN }}
          PLATFORM: ${{ inputs.PLATFORM }}
          DOCKERFILE: ${{ inputs.DOCKERFILE }}
          MAINTAINER: ${{ inputs.MAINTAINER }}
          WORKING_DIRECTORY: ${{ inputs.CODE_WORKING_DIRECTORY }}
          ARTIFACTS_PATTERN: ${{ inputs.ARTIFACTS_PATTERN }}
          ARTIFACTS_DIR: ${{ inputs.ARTIFACTS_DIR }}
          BUILD_LOG_FILENAME: "artifacts-${GITHUB_RUN_ID}-${GITHUB_SHA}.log"
        env:
          REPO_USERNAME: ${{ secrets.REPO_USERNAME }}
          REPO_PASSWORD: ${{ secrets.REPO_PASSWORD }}
          DEPLOYMENT_TOKEN: ${{ secrets.DEPLOYMENT_TOKEN }}

      - name: Upload build logs
        uses: actions/upload-artifact@v6
        with:
          name: ${{ inputs.TARGET_ARTIFACT_NAME }}.log
          path: ${{ inputs.CODE_WORKING_DIRECTORY }}/artifacts-*.log
          if-no-files-found: warn
          retention-days: ${{ inputs.LOG_RETENTION_DAYS }}

      - name: Compress build artifacts
        if: ${{ inputs.UPLOAD_BUILD_ARTIFACTS }}
        shell: bash
        working-directory: ${{ inputs.CODE_WORKING_DIRECTORY }}
        env:
          ARTIFACTS_DIR: ${{ inputs.ARTIFACTS_DIR }}
          TARGET_ARTIFACT_NAME: ${{ inputs.TARGET_ARTIFACT_NAME }}
        run: |
          tar -czvf "${TARGET_ARTIFACT_NAME}.tar.gz" -C "${ARTIFACTS_DIR}" $(ls -1 "${ARTIFACTS_DIR}")
          echo "${GITHUB_SHA}" > hash.txt

      # Upload artifacts to the GCS packages bucket before the Teleport copy.
      # Object path = META_FILE_PATH_PREFIX with GCS_DST_STRIP_REGEX removed.
      # Non-blocking until the Teleport copy is removed.
      - name: Copy artifacts to GCS
        id: gcs_copy
        if: ${{ inputs.UPLOAD_BUILD_ARTIFACTS && inputs.UPLOAD_WITH_GCS }}
        continue-on-error: true
        timeout-minutes: 10
        uses: ./actions/.github/actions/rclone-s3-sync
        with:
          SRC: ${{ inputs.CODE_WORKING_DIRECTORY }}/${{ inputs.TARGET_ARTIFACT_NAME }}.tar.gz
          DST: ${{ inputs.META_FILE_PATH_PREFIX }}/${{ inputs.TARGET_ARTIFACT_NAME }}.tar.gz
          DST_STRIP_REGEX: ${{ inputs.GCS_DST_STRIP_REGEX }}
          SYNC_TYPE: local-to-remote
          OPERATION: copyto
          S3_PROVIDER: gcs-oidc
          S3_BUCKET: ${{ inputs.GCS_BUCKET }}
          GCS_WORKLOAD_IDENTITY_PROVIDER: ${{ env.GCS_WORKLOAD_IDENTITY_PROVIDER }}

      # After the tarballs, so a run directory never has a hash before its artifacts.
      - name: Copy hash file to GCS
        if: ${{ steps.gcs_copy.outcome == 'success' }}
        continue-on-error: true
        timeout-minutes: 10
        uses: ./actions/.github/actions/rclone-s3-sync
        with:
          SRC: ${{ inputs.CODE_WORKING_DIRECTORY }}/hash.txt
          DST: ${{ inputs.META_FILE_PATH_PREFIX }}/hash.txt
          DST_STRIP_REGEX: ${{ inputs.GCS_DST_STRIP_REGEX }}
          SYNC_TYPE: local-to-remote
          OPERATION: copyto
          S3_PROVIDER: gcs-oidc
          S3_BUCKET: ${{ inputs.GCS_BUCKET }}
          GCS_WORKLOAD_IDENTITY_PROVIDER: ${{ env.GCS_WORKLOAD_IDENTITY_PROVIDER }}

      - name: Copy/Exec artifacts/commands to/on remote host
        if: ${{ inputs.UPLOAD_BUILD_ARTIFACTS && inputs.UPLOAD_WITH_TELEPORT }}
        uses: ./actions/.github/actions/teleport
        with:
          EXEC_COMMANDS_PRE: "mkdir -p ${{ inputs.META_FILE_PATH_PREFIX }}"
          FILES: "./${{ inputs.CODE_WORKING_DIRECTORY }}/*.tar.gz"
          EXEC_COMMANDS: 'echo "${{ github.sha }}" > ${{ inputs.META_FILE_PATH_PREFIX }}/hash.txt'
          FILES_FOLDER: ${{ inputs.META_FILE_PATH_PREFIX }}
          TELEPORT_VERSION: "18.1.4"
        env:
          HOSTNAME: ${{ secrets.HOSTNAME }}
          PROXY_URL: ${{ secrets.PROXY_URL }}
          TOKEN: ${{ secrets.TELEPORT_TOKEN }}
          USERNAME: ${{ secrets.USERNAME }}
